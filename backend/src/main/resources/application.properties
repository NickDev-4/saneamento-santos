spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
spring.mongodb.database=saneamento_santos
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:true}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
files.storage-directory=${FILES_STORAGE_DIRECTORY:./uploads}
santos.service-area.geojson=${SANTOS_SERVICE_AREA_GEOJSON:}
geocoding.nominatim-url=${GEOCODING_NOMINATIM_URL:https://nominatim.openstreetmap.org/search}
geocoding.user-agent=${GEOCODING_USER_AGENT:SaneamentoSantos/1.0}
recovery.email.from=${RECOVERY_EMAIL_FROM:}
recovery.frontend-url=${RECOVERY_FRONTEND_URL:}
recovery.token-lifetime-minutes=${RECOVERY_TOKEN_LIFETIME_MINUTES:30}
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
