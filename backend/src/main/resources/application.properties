spring.application.name=backend
spring.config.import=optional:file:.env[.properties]
spring.mongodb.database=saneamento_santos
spring.data.mongodb.auto-index-creation=${MONGODB_AUTO_INDEX_CREATION:true}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB
files.storage-directory=${FILES_STORAGE_DIRECTORY:./uploads}
santos.service-area.geojson=${SANTOS_SERVICE_AREA_GEOJSON:}
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
